# Hệ số điều chỉnh theo sắc thái câu nói (prompt tone). Cộng (add) hoặc nhân (mul) vào tham số nền.
tone_modifiers:
  panicked:   {f0_offset_st: 2.5, tempo_mul: 1.18, pause_mul: 0.75, breathiness_add: 0.06, range_mul: 1.12, inhale_prob: 0.9}
  urgent:     {f0_offset_st: 1.8, tempo_mul: 1.12, pause_mul: 0.80, breathiness_add: 0.03, range_mul: 1.08}
  in_pain:    {f0_offset_st: 1.2, tempo_mul: 0.95, pause_mul: 1.20, breathiness_add: 0.10, range_mul: 1.05, creak_add: 0.15}
  breathless: {f0_offset_st: 0.8, tempo_mul: 1.00, pause_mul: 1.35, breathiness_add: 0.14, range_mul: 0.98, inhale_prob: 1.0}
  strained:   {f0_offset_st: 1.5, tempo_mul: 1.05, pause_mul: 0.95, breathiness_add: 0.05, range_mul: 1.06}
  calm:       {}
  conversational: {range_mul: 1.02}
  relaxed:    {tempo_mul: 0.97, pause_mul: 1.05}
  gentle:     {f0_offset_st: 0.3, tempo_mul: 0.97, range_mul: 1.03}
  cheerful:   {f0_offset_st: 0.8, tempo_mul: 1.03, range_mul: 1.08}

# Vùng được ghi đè bởi tools/calibrate_aging.py (gender -> age_bin -> dsp overrides)
calibrated:
  nam:
    "50_59": {jitter_pct: 1.4, shimmer_db: 0.05, breathiness: 0.104}
    "60_69": {jitter_pct: 3.36, shimmer_db: 0.09, breathiness: 0.306}
    "70_79": {jitter_pct: 4.4, shimmer_db: 0.364, breathiness: 0.51}
    "80_plus": {jitter_pct: 6.6, shimmer_db: 0.3, breathiness: 0.714}
  nu:
    "50_59": {jitter_pct: 0.6, shimmer_db: 0.06, breathiness: 0.176}
    "60_69": {jitter_pct: 1.82, shimmer_db: 0.1, breathiness: 0.396}
    "70_79": {jitter_pct: 3.12, shimmer_db: 0.16, breathiness: 0.51}
    "80_plus": {jitter_pct: 4.42, shimmer_db: 0.225, breathiness: 0.924}
