# Cấu hình tham số sinh lý âm học lão hóa (Presbyphonia) theo độ tuổi
# [legacy v2] age_groups giữ lại để tương thích ngược. Engine v3.0 dùng mục `profiles` bên dưới.
age_groups:
  "50_59":
    description: "Độ tuổi 50-59: Bắt đầu lão hóa nhẹ, âm sắc hơi trầm, nhịp nói ổn định"
    tempo_scale: 0.95
    pitch_shift_semitones: -0.5
    tremor_depth: 0.012
    tremor_rate_hz: 5.5
    jitter_factor: 0.012
    shimmer_factor: 0.025
    breathiness_gain: 0.015
    lowpass_cutoff_hz: 7500

  "60_69":
    description: "Độ tuổi 60-69: Dây thanh âm giảm độ đàn hồi, hơi khàn nhẹ, tốc độ nói chậm lại"
    tempo_scale: 0.88
    pitch_shift_semitones: -1.2
    tremor_depth: 0.025
    tremor_rate_hz: 5.2
    jitter_factor: 0.022
    shimmer_factor: 0.045
    breathiness_gain: 0.030
    lowpass_cutoff_hz: 7000

  "70_79":
    description: "Độ tuổi 70-79: Lão hóa rõ rệt, rung thanh quản (vocal tremor), hụt hơi, ngắt nghỉ dài hơn"
    tempo_scale: 0.80
    pitch_shift_semitones: -1.8
    tremor_depth: 0.045
    tremor_rate_hz: 4.8
    jitter_factor: 0.035
    shimmer_factor: 0.070
    breathiness_gain: 0.050
    lowpass_cutoff_hz: 6500

  "80_plus":
    description: "Độ tuổi 80+: Giọng yếu, run rẩy cao độ, biên độ dao động thất thường, hơi thở dồn dập"
    tempo_scale: 0.72
    pitch_shift_semitones: -2.2
    tremor_depth: 0.065
    tremor_rate_hz: 4.5
    jitter_factor: 0.050
    shimmer_factor: 0.095
    breathiness_gain: 0.075
    lowpass_cutoff_hz: 6000

# Tiêu chuẩn âm học kiểm định (Benchmark Gates theo plan.md Giai đoạn 5)
acoustic_benchmarks:
  sample_rate_hz: 48000
  target_format: "wav"
  bit_depth: 16
  channels: 1
  f0_range_male: [80.0, 160.0]
  f0_range_female: [140.0, 240.0]
  min_hnr_db: 10.0
  max_jitter_percent: 5.0
  max_shimmer_percent: 10.0

# =============================================================================
# v3.0 — WORLD aging engine: hồ sơ theo GIỚI TÍNH × NHÓM TUỔI
# -----------------------------------------------------------------------------
# target : mục tiêu âm học đo bằng Praat (lấy từ docs/ACOUSTIC_BENCHMARK.md)
#          LƯU Ý (nam): giọng nam ZeroTTS gốc đã có jitter ~3% / shimmer ~8% / HNR ~11-12 dB do độ
#          thô của codec, cao hơn y văn cho tuổi 50-69. DSP không thể làm giọng "sạch" hơn nguồn,
#          nên mục tiêu nam = baseline nguồn + mức tăng theo tuổi (xu hướng tăng dần được giữ).
#          - f0_hz / speech_rate_syl_s là đích ADAPTIVE: engine đo giọng gốc rồi
#            dịch/co giãn tới đích (không áp hệ số cố định).
# qc     : dải chấp nhận của cổng QC (rộng hơn target, chỉ để bắt mẫu lỗi).
# dsp    : tham số DSP nền (điểm khởi đầu; tools/calibrate_aging.py ghi đè vào `calibrated`).
# traits : dải lấy mẫu "dấu vân tay" riêng từng cụ (seed = hash speaker.id).
# =============================================================================
profiles:
  nam:
    "50_59":
      target: {f0_hz: 122.0, speech_rate_syl_s: 4.1, jitter_pct: 3.1, shimmer_pct: 8.0, hnr_db: 12.5}
      qc: {f0_hz: [95, 150], jitter_pct: [0.5, 4.5], shimmer_pct: [2.0, 11.0], hnr_db: [7.0, 22.0], speech_rate_syl_s: [3.3, 5.0]}
      dsp: {jitter_pct: 0.5, shimmer_db: 0.1, tremor_f0_depth: 0.0, tremor_amp_depth: 0.0, breathiness: 0.08, formant_warp: 0.99, spectral_tilt_db_oct: -0.5, creak_prob: 0.05, voice_break_prob: 0.0, pause_scale: 1.10, inhale_prob: 0.15, chest_warmth: 0.10, hf_cutoff_hz: 0}
      traits: {f0_offset_st: [-1.2, 1.2], formant_warp: [-0.012, 0.012], hoarseness: [0.1, 0.45], tremor_severity: [0.0, 0.3], tremor_rate_hz: [5.0, 6.5], speech_rate_factor: [0.94, 1.08], pitch_range_scale: [0.95, 1.05], spectral_tilt_db_oct: [-0.4, 0.4]}
    "60_69":
      target: {f0_hz: 113.0, speech_rate_syl_s: 3.7, jitter_pct: 3.5, shimmer_pct: 9.0, hnr_db: 11.5}
      qc: {f0_hz: [88, 140], jitter_pct: [0.8, 5.0], shimmer_pct: [3.0, 12.0], hnr_db: [6.0, 20.0], speech_rate_syl_s: [2.9, 4.6]}
      dsp: {jitter_pct: 1.2, shimmer_db: 0.18, tremor_f0_depth: 0.006, tremor_amp_depth: 0.03, breathiness: 0.18, formant_warp: 0.98, spectral_tilt_db_oct: -1.0, creak_prob: 0.15, voice_break_prob: 0.0, pause_scale: 1.25, inhale_prob: 0.30, chest_warmth: 0.12, hf_cutoff_hz: 9000}
      traits: {f0_offset_st: [-1.5, 1.5], formant_warp: [-0.012, 0.012], hoarseness: [0.2, 0.6], tremor_severity: [0.1, 0.5], tremor_rate_hz: [4.8, 6.2], speech_rate_factor: [0.92, 1.08], pitch_range_scale: [0.92, 1.02], spectral_tilt_db_oct: [-0.5, 0.5]}
    "70_79":
      target: {f0_hz: 120.0, speech_rate_syl_s: 3.2, jitter_pct: 4.1, shimmer_pct: 10.5, hnr_db: 10.5}
      qc: {f0_hz: [90, 150], jitter_pct: [1.0, 6.5], shimmer_pct: [4.0, 14.0], hnr_db: [5.0, 18.0], speech_rate_syl_s: [2.4, 4.1]}
      dsp: {jitter_pct: 2.0, shimmer_db: 0.28, tremor_f0_depth: 0.015, tremor_amp_depth: 0.06, breathiness: 0.3, formant_warp: 0.97, spectral_tilt_db_oct: -1.5, creak_prob: 0.30, voice_break_prob: 0.02, pause_scale: 1.45, inhale_prob: 0.50, chest_warmth: 0.15, hf_cutoff_hz: 8000}
      traits: {f0_offset_st: [-1.5, 1.5], formant_warp: [-0.012, 0.012], hoarseness: [0.3, 0.8], tremor_severity: [0.3, 0.8], tremor_rate_hz: [4.5, 6.0], speech_rate_factor: [0.90, 1.08], pitch_range_scale: [0.90, 1.0], spectral_tilt_db_oct: [-0.6, 0.6]}
    "80_plus":
      target: {f0_hz: 128.0, speech_rate_syl_s: 2.8, jitter_pct: 4.8, shimmer_pct: 12.0, hnr_db: 9.5}
      qc: {f0_hz: [95, 165], jitter_pct: [1.5, 8.0], shimmer_pct: [5.0, 16.0], hnr_db: [4.0, 16.0], speech_rate_syl_s: [2.0, 3.7]}
