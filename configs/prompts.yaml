# Danh mục kịch bản phát âm tiếng Việt cho người cao tuổi
categories:
  - id: "giong_noi_keu_cuu"
    display_name: "Giọng nói kêu cứu"
    description: "Các tình huống khẩn cấp: ngã ngửa, đau ốm, khó thở, gọi người thân cứu giúp"
    prompts:
      - id: "kc_01"
        code: "keu_cuu_01_khan_cap"
        text: "Gia An ơi, cứu tôi với!"
        intent: "HELP"
        urgency: "critical"
        tone: "panicked"
      - id: "kc_02"
        code: "keu_cuu_02_bi_nga"
        text: "Tôi bị ngã rồi, đau quá không tự đứng dậy được!"
        intent: "HELP_FALL"
        urgency: "critical"
        tone: "in_pain"
      - id: "kc_03"
        code: "keu_cuu_03_kho_tho"
        text: "Tôi thấy tức ngực và khó thở quá, gọi xe cấp cứu giúp tôi mau!"
        intent: "HELP_MEDICAL"
        urgency: "critical"
        tone: "breathless"
      - id: "kc_04"
        code: "keu_cuu_04_co_ai_khong"
        text: "Có ai ở ngoài đó không? Vào đây giúp tôi với!"
        intent: "HELP_CALL_OUT"
        urgency: "high"
        tone: "strained"
      - id: "kc_05"
        code: "keu_cuu_05_goi_nguoi_nha"
        text: "Gia An ơi, gọi điện thoại gấp cho con trai tôi liền đi!"
        intent: "CALL_FAMILY_EMERGENCY"
        urgency: "critical"
        tone: "urgent"

  - id: "giong_sinh_hoat"
    display_name: "Giọng sinh hoạt thường ngày"
    description: "Các giao tiếp và câu lệnh sinh hoạt hàng ngày trong gia đình"
    prompts:
      - id: "sh_01"
        code: "sinh_hoat_01_uong_thuoc"
        text: "Gia An ơi, hôm nay mấy giờ tôi phải uống thuốc huyết áp vậy?"
        intent: "REMINDER_QUERY"
        urgency: "normal"
        tone: "calm"
      - id: "sh_02"
        code: "sinh_hoat_02_nhac_nho"
        text: "Tối nay lúc tám giờ nhắc tôi uống sữa chua nhé."
        intent: "REMINDER_CREATE"
        urgency: "normal"
        tone: "conversational"
      - id: "sh_03"
        code: "sinh_hoat_03_bat_den"
        text: "Bật đèn phòng khách giúp tôi với, trời tối rồi."
        intent: "DEVICE_CONTROL"
        urgency: "normal"
        tone: "relaxed"
      - id: "sh_04"
        code: "sinh_hoat_04_thoi_tiet"
        text: "Hôm nay trời có lạnh không con, ra ngoài có cần mặc thêm áo ấm không?"
        intent: "WEATHER_QUERY"
        urgency: "low"
        tone: "gentle"
      - id: "sh_05"
        code: "sinh_hoat_05_chao_hoi"
        text: "Chào buổi sáng Gia An, mở giùm tôi bản tin thời sự sáng nay."
        intent: "GREETING_NEWS"
        urgency: "low"
        tone: "cheerful"

  - id: "giong_co_nhieu"
    display_name: "Giọng có nhiễu môi trường"
    description: "Giọng nói người già trong môi trường thực tế bị ảnh hưởng bởi tạp âm sinh hoạt"
    prompts:
      - id: "nh_01"
        code: "co_nhieu_01_tieng_tivi"
        text: "Gia An ơi, tôi bị chóng mặt quá, vào đỡ tôi ngồi xuống ghế với!"
        intent: "HELP"
        urgency: "high"
        noise_profile: "tv_background"
        snr_db: 8.0
        description: "Mô phỏng người già gọi trợ giúp khi tivi phòng khách đang phát thời sự"
      - id: "nh_02"
        code: "co_nhieu_02_tieng_bep"
        text: "Tắt giùm tôi cái bếp điện đang nấu canh trong bếp với!"
        intent: "DEVICE_CONTROL"
        urgency: "normal"
        noise_profile: "kitchen_noise"
        snr_db: 10.0
        description: "Tiếng nói lẫn tạp âm chén bát, xào nấu và quạt hút mùi"
      - id: "nh_03"
        code: "co_nhieu_03_tieng_quat"
        text: "Gia An ơi, gọi cho con gái bảo chiều nay ghé qua mua thuốc cho mẹ nhé."
        intent: "CALL_FAMILY"
        urgency: "normal"
        noise_profile: "fan_noise"
        snr_db: 12.0
        description: "Giọng nói bị ù do tiếng quạt gió hoặc điều hòa máy lạnh kế bên"
      - id: "nh_04"
        code: "co_nhieu_04_tieng_on_ngoai_duong"
        text: "Có ai gõ cửa ngoài cổng đó hả Gia An, xem giúp tôi ai tới vậy?"
        intent: "SMART_HOME_QUERY"
        urgency: "normal"
        noise_profile: "street_ambient"
        snr_db: 10.0
        description: "Tạp âm xe cộ, tiếng còi xe từ mặt đường hắt vào nhà"
      - id: "nh_05"
        code: "co_nhieu_05_keu_cuu_farfield"
        text: "Cứu... cứu bà với... bà ngã ở đây không dậy được..."
        intent: "HELP_FALL"
        urgency: "critical"
        noise_profile: "room_reverb_farfield"
        snr_db: 6.0
        description: "Kêu cứu ở khoảng cách xa (far-field) có tiếng vang phòng và tiếng ồn nền nhà"
